<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VJS Finance - CV. Via Jaya Sinergi</title>
<meta name="theme-color" content="#1E3A8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1E3A8A;color:#fff;z-index:2;transition:opacity .3s}
  #splash img{width:84px;height:84px;border-radius:20px}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #offline{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f8fafc;color:#0f172a;text-align:center;padding:24px;z-index:3}
  #offline button,#offline a{padding:10px 18px;border-radius:10px;border:0;background:#1E3A8A;color:#fff;font-weight:600;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
<div id="splash"><img src="icons/icon-192.png" alt=""><b>CV. VIA JAYA SINERGI</b><div class="spin"></div></div>
<div id="offline">
  <h2>Tidak ada koneksi internet</h2>
  <p>Aplikasi memerlukan internet untuk mengambil data dari Google Sheets.</p>
  <button onclick="loadApp()">Coba Lagi</button>
</div>
<iframe id="app" title="VJS Finance" allow="clipboard-write; fullscreen"></iframe>

<script>
  // >>> GANTI dengan URL Web App Apps Script Anda (yang berakhiran /exec) <<<
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFHlMVE14hPKC40NgYqMQDEiaWN3ip64VYOrM50Tl1NLYBKdO67cRXsaHeqmDsp-l-/exec";

  const frame = document.getElementById("app");
  const splash = document.getElementById("splash");
  const offline = document.getElementById("offline");

  function loadApp() {
    if (!navigator.onLine) { offline.style.display = "flex"; splash.style.display = "none"; return; }
    offline.style.display = "none"; splash.style.display = "flex"; splash.style.opacity = 1;
    frame.src = APPS_SCRIPT_URL;
  }
  frame.addEventListener("load", () => {
    splash.style.opacity = 0; setTimeout(() => splash.style.display = "none", 300);
  });
  window.addEventListener("online", loadApp);
  window.addEventListener("offline", () => { offline.style.display = "flex"; });
  loadApp();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.error));
  }
</script>
</body>
</html>
